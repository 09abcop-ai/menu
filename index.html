<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>منيو الارجوانة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#14302B;--paper:#F2F6F4;--saffron:#E8A22B;--muted:#5E7A73;--line:#C4D3CE}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;font-size:17px}
  header{background:var(--ink);color:#fff;padding:34px 20px 26px;text-align:center}
  header h1{font-family:"Reem Kufi",serif;font-size:2.8rem;line-height:1.2}
  header p{color:#B9D0C9;margin-top:6px;font-size:.95rem}
  nav{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;gap:8px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{flex:none;text-decoration:none;color:var(--ink);padding:7px 16px;border-radius:999px;border:1.5px solid var(--ink);font-weight:500;font-size:.95rem}
  nav a:active{background:var(--ink);color:#fff}
  main{max-width:640px;margin:0 auto;padding:8px 18px 60px}
  section{padding-top:28px;scroll-margin-top:60px}
  section h2{font-family:"Reem Kufi",serif;font-size:1.7rem;margin-bottom:6px}
  .item{display:flex;align-items:baseline;gap:10px;padding:11px 0}
  .name{font-weight:600}
  .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:16px}
  .price{font-weight:600;font-size:1.1rem;white-space:nowrap;background:var(--saffron);padding:1px 10px;border-radius:6px}
  .price small{font-weight:500;font-size:.75rem;margin-inline-start:2px}
  .item.sized{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:1px dotted var(--line)}
  .sizes{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;flex-direction:column;align-items:center;background:var(--saffron);border-radius:8px;padding:2px 14px;font-weight:600;line-height:1.5}
  .chip em{font-style:normal;font-weight:500;font-size:.72rem}
  footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 20px 40px}
</style>
</head>
<body>

<header>
  <h1>الارجوانة</h1>
  <p>أهلاً بيك .. اختار الداير</p>
</header>

<nav id="tabs"></nav>
<main id="menu"></main>

<footer>الأسعار بالجنيه السوداني وممكن تتغير</footer>

<script>
const CURRENCY = "ج";
const MENU = [
  { title: "بيتزا", items: [
    { n: "بيتزا هوت دوق", s: [["صغيرة",20000],["وسط",27000],["كبيرة",30000]] },
    { n: "بيتزا فراخ", s: [["صغيرة",23000],["وسط",27000],["كبيرة",30000]] },
    { n: "بيتزا مشكلة", s: [["صغيرة",25000],["وسط",28000],["كبيرة",35000]] },
  ]},
  { title: "فطائر شامية", items: [
    { n: "فطيرة شامية فراخ", p: 14000 },
    { n: "فطيرة شامية هوت دوق", p: 14000 },
    { n: "فطيرة شامية مشكلة", p: 17000 },
    { n: "فطيرة ارجوانة", p: 17000 },
    { n: "فطيرة شامية اندومي", p: 10000 },
  ]},
  { title: "اندومي", items: [
    { n: "اندومي كلاسك", p: 5000 },
    { n: "اندومي بالجبنة", p: 7000 },
    { n: "اندومي هوت دوق", p: 7000 },
    { n: "اندومي بالزرة الشامية", p: 7000 },
    { n: "اندومي توكس", p: 8000 },
  ]},
  { title: "شاورما", items: [
    { n: "شاورما عيش", p: 10000 },
    { n: "شاورما فطيرة", p: 12000 },
    { n: "شاورما جامبو", p: 16000 },
    { n: "شاورما عربي", p: 17000 },
    { n: "شاورما طلب", p: 18000 },
  ]},
  { title: "كرسبي", items: [
    { n: "كرسبي عيش", p: 11000 },
    { n: "كرسبي فطيرة", p: 13000 },
    { n: "كرسبي جامبو", p: 16000 },
    { n: "كرسبي جبنة", p: 16000 },
    { n: "كرسبي طلب", p: 18000 },
  ]},
  { title: "برقر", items: [
    { n: "برقر عادي", p: 8000 },
    { n: "برقر بالجبنة", p: 9000 },
    { n: "برقر جامبو", p: 10000 },
  ]},
  { title: "ساندويتشات", items: [
    { n: "بيض", p: 4000 },
    { n: "طعمية عيش", p: 4000 },
    { n: "طعمية فطيرة", p: 5000 },
    { n: "شيبس عيش", p: 6000 },
    { n: "شيبس فطيرة", p: 7000 },
    { n: "هوت دوق", p: 7000 },
    { n: "زيادة عيش", p: 1000 },
  ]},
  { title: "عصائر", items: [
    { n: "عصير برتقال", p: 4000 },
    { n: "عصير موز", p: 4000 },
    { n: "عصير اناناس", p: 8000 },
    { n: "عصير فراولة", p: 8000 },
    { n: "عصير منقة", p: 8000 },
    { n: "عصير مشكل", p: 8000 },
  ]},
];

const tabs = document.getElementById("tabs");
const menu = document.getElementById("menu");
const fmt = n => n.toLocaleString("en-US");

MENU.forEach((cat, i) => {
  const id = "cat" + i;
  tabs.insertAdjacentHTML("beforeend", `<a href="#${id}">${cat.title}</a>`);
  const rows = cat.items.map(it => {
    if (it.s) {
      const chips = it.s.map(([l, p]) => `<span class="chip"><em>${l}</em>${fmt(p)}</span>`).join("");
      return `<div class="item sized"><div class="name">${it.n}</div><div class="sizes">${chips}</div></div>`;
    }
    return `<div class="item"><div class="name">${it.n}</div><div class="dots"></div><div class="price">${fmt(it.p)}<small>${CURRENCY}</small></div></div>`;
  }).join("");
  menu.insertAdjacentHTML("beforeend", `<section id="${id}"><h2>${cat.title}</h2>${rows}</section>`);
});
</script>
</body>
</html>
